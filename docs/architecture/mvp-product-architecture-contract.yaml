contract:
  id: dev-automation-platform-mvp-product-architecture
  version: 0.2.0
  status: working_snapshot
  snapshot_date: 2026-09-08
  language: en
  purpose: >-
    Preserve the currently accepted product and architecture decisions for the
    Dev Automation Platform while MVP product design is still in progress. This
    document is the current design snapshot for the new product model. It is not
    a statement that the existing control-plane implementation already conforms
    to this model.
  relationship_to_existing_control_plane:
    legacy_documents_remain_historical: true
    current_v2_implementation_must_not_be_assumed_to_match_this_contract: true
    migration_or_reuse_requires_explicit_design: true
    note: >-
      Existing Control Plane v2 contracts describe an earlier run/step_run,
      executor/reviewer, SQLite queue architecture. They are implementation
      inputs to evaluate later, not the authoritative product model captured here.

product_intent:
  primary_goal: >-
    The user plans a software project once, starts the platform, and can then
    leave it running autonomously until it reaches verified working states and
    ultimately produces an application build ready for user testing.
  user_operating_model:
    - user_performs_deep_initial_project_planning
    - user_provides_one_standardized_Project_Core
    - platform_owns_continuous_execution_after_start
    - user_observes_and_intervenes_only_when_desired_or_escalated
    - user_can_pause_switch_project_review_and_resume
  autonomy_target:
    - minimal_user_intervention_after_startup
    - continuous_planning_implementation_verification_correction_and_continuation
    - structured_handoff_between_model_sessions
    - workers_must_not_stop_merely_because_an_agent_claims_work_is_good_enough
  initial_workload:
    - small_and_medium_SoftOS_ecosystem_applications
    - SoftOS_Documents_as_representative_target
  initial_worker_strategy:
    primary_worker_family: MiniMax
    runtime_direction: OpenCode_sessions
    architecture_should_remain_model_agnostic: true
  execution_environment:
    default: isolated_development_environment
    expected_hosts:
      - local_machine
      - VPS
    host_OS_mutation_by_agents: forbidden_by_default
    isolated_dependency_installation: desired
    serious_stack_or_architecture_changes: user_escalation
    minor_dependency_or_library_changes: may_be_agent_decided_within_policy

authority_and_precedence:
  accepted_direction:
    Project_Core: highest_project_intent_authority
    explicit_user_directive: may_change_live_plan_but_must_not_silently_violate_Core
    Project_State: authoritative_live_development_state
    Epic_Feature_Task_Bug: planning_and_work_entities_bounded_by_higher_authority
    Completion_Policy_and_Profile: quality_constraints_that_cannot_weaken_higher_policy
    Work_Contract: execution_snapshot_for_one_agent_session
  exact_conflict_resolution_order: OPEN_ISSUE
  Core_conflict_behavior: escalate_to_user

core_principles:
  - id: standardized_interfaces
    rule: >-
      Project, planning, work, result, gate, evidence, escalation, profile, and
      user-control artifacts use stable standardized schemas rather than
      project-specific ad-hoc formats.
  - id: minimal_role_context
    rule: >-
      Agents receive a deliberately assembled Context Package for their role and
      current work instead of the entire project by default.
  - id: no_chat_history_dependency
    rule: >-
      A fresh execution session must be able to start from structured artifacts,
      repository state, checkpoints, and referenced evidence without requiring
      the previous model chat transcript.
  - id: evidence_over_claims
    rule: >-
      Agent statements that work is complete are insufficient. Completion is
      granted only through the relevant Gatekeeper and evidence gate.
  - id: role_separation
    rule: >-
      Orchestration, planning, implementation, verification, and user-intent
      analysis remain separate responsibilities.
  - id: gatekeeper_never_fixes
    rule: >-
      Gatekeepers do not repair implementation defects. Failed work returns to
      the implementation/planning flow as structured Bug work.
  - id: immutable_execution_history
    rule: >-
      Completed Work Contracts, Session Results, Gate Results, Evidence, and
      other historical execution records are not edited retrospectively.
  - id: sealed_planning_hierarchy
    rule: >-
      Task, Feature, and Epic become sealed after the corresponding accepted gate.
      Any higher-level corrective exception must be explicit and traceable.
  - id: controlled_core_change
    rule: >-
      Product ideology and user-declared Core constraints cannot be silently
      changed by the platform.
  - id: rolling_horizon
    rule: >-
      The platform plans enough detail to execute the current horizon but does not
      create a full detailed Task tree for the whole project at bootstrap.
  - id: deterministic_facts_plus_model_semantics
    rule: >-
      Runtime facts should be collected deterministically by the platform where
      possible; models should add semantic interpretation rather than restating
      facts that the runtime can observe directly.

project_core:
  canonical_entity: Project_Core
  role: immutable_baseline_project_description
  location: product_repository
  format_direction: standardized_machine_readable_template
  template_rule: >-
    One shared template is used across projects. Sections may be empty when they
    do not apply instead of inventing a different structure per project.
  may_contain:
    - product_idea
    - product_ideology
    - required_features
    - UX_principles
    - architecture_constraints
    - target_platforms
    - SoftOS_integrations
    - implementation_rules
    - quality_requirements
    - non_goals
    - open_questions
    - closed_questions
    - user_declared_invariants
  mutation_policy:
    agents_modify_core: false
    user_manual_revision: allowed
    automatic_status_updates_inside_Core: false
    architecture_decisions_outside_Core: allowed_when_policy_permits
  rationale: >-
    Core must continue to answer what the project is supposed to be rather than
    becoming a mixture of specification, journal, plan, and runtime state.
  exact_template_and_revision_protocol: OPEN_ISSUE

project_state:
  canonical_entity: Project_State
  role: mutable_current_state_of_development
  logical_model: one_entity
  physical_model: split_files_direction
  source_of_truth_location: platform_service_directory
  product_repository_is_not_live_state_source: true
  suggested_shape:
    - state/current.yaml
    - state/epics.yaml
    - state/decisions.yaml
    - state/blockers.yaml
    - state/history/
  export:
    supported: true
    example: project-state.bundle.yaml
    purposes:
      - handoff_to_external_model
      - user_review
      - backup
      - diagnostics
  repository_strategy:
    product_repo_contains:
      - source_code
      - Project_Core
      - project_owned_tests_and_assets
    platform_state_area_contains:
      - runtime_state
      - planning_entities
      - contracts
      - results
      - evidence_metadata
      - sessions
      - directives
      - platform_history
    synchronization_direction: local_and_VPS
    versioned_state_repo_direction: accepted_in_principle
  suggested_root: ~/.softos-dev/projects/<project-key>/
  exact_file_split_and_DB_boundary: OPEN_ISSUE

application_type:
  projects_have_one_primary_application_type_in_MVP: true
  immutable_after_project_start: true
  examples_direction:
    - desktop
    - web
    - mobile
  exact_enum: OPEN_ISSUE
  role: select_relevant_profile_registry_scope_and_runtime_expectations

identity_and_traceability:
  MVP_id_direction: simple_human_readable_ids
  examples:
    - epic-003
    - feature-007
    - task-014
    - bug-005
    - work-014
    - session-027
    - gate-041
    - evidence-184
  explicit_relationships: required_where_relevant
  graph_database_required: false
  immutable_lineage_direction: true
  exact_internal_vs_display_id_strategy: OPEN_ISSUE

bootstrap:
  orchestrator_initial_inputs:
    - Project_Core
    - Orchestrator_System_Prompt
    - Environment_Manifest
  Bootstrap_Plan_entity: not_required
  first_run_direction:
    - validate_project_inputs
    - create_initial_Project_State
    - derive_initial_Epic_horizon
    - launch_required_planning_role
  exact_bootstrap_validation_and_first_Epic_selection: OPEN_ISSUE

runtime_environment_manifest:
  canonical_entity: Environment_Manifest
  format: YAML
  authoring_for_MVP: manual
  structure:
    global_base_manifest: true
    small_project_override: true
  purpose: >-
    Describe what the platform can actually do and what it is permitted to do in
    the current environment, including project runtime commands.
  expected_content:
    - available_models_and_roles
    - tools_and_capability_flags
    - filesystem_permissions
    - shell_permissions
    - network_permissions
    - repository_and_worktree_paths
    - browser_automation_availability
    - dependency_installation_policy
    - sudo_or_elevation_policy
    - architecture_change_approval_policy
    - external_service_policy
    - runtime_limits
    - request_budget
    - concurrency_limits
    - project_run_commands
    - project_test_commands
    - project_build_commands
    - project_lint_commands
  separate_Project_Runtime_Contract_for_MVP: false
  override_merge_semantics: OPEN_ISSUE

profile_registry:
  canonical_entity: Profile_Registry
  location_direction: global_platform_registry
  purpose: >-
    Store a limited, carefully designed canonical set of completion profiles so
    common quality rules do not have to be rewritten inside every Task or project.
  registry_scopes:
    - common
    - application_type_specific
  project_selection:
    one_application_type_in_MVP: true
    available_profiles: common_plus_selected_application_type
  profile_creation:
    planner_may_propose_new_profile: true
    new_profile_requires_user_approval: true
    approval_channel: Telegram
    profile_may_be_used_before_approval: false
    approved_profile_is_added_to_global_registry: true
    approval_history_should_be_preserved: true
  Task_usage:
    one_primary_completion_profile_is_default: true
    Task_name_should_correspond_to_primary_profile: true
    multiple_profiles_allowed_only_as_exception: true
    multiple_profiles_signal_possible_bad_decomposition: true
  schema_rule:
    separate_Task_schema_per_profile: false
    one_standardized_Task_schema: true
    profiles_modify_quality_requirements_not_entity_shape: true
  profile_may_inject:
    - required_checks
    - required_evidence
    - universal_acceptance_criteria
    - completion_policy_conditions
    - profile_specific_constraints
  planner_adds_entity_specific_acceptance_criteria: true
  candidate_Task_profiles_from_prior_work_not_yet_frozen:
    - design
    - data
    - migration
    - backend
    - frontend
    - integration
    - testing
  exact_profile_catalog_and_non_Task_applicability: OPEN_ISSUE

completion_policy:
  canonical_concept: Completion_Policy
  purpose: >-
    Define reusable completion requirements once and compose them into an entity
    instead of duplicating the same Definition of Done clauses everywhere.
  inheritance_direction:
    - platform_baseline
    - project_policy
    - profile_policy
    - entity_specific_additions
  weakening_inherited_requirements: forbidden
  explicit_user_or_project_additional_conditions: allowed
  execution_snapshot:
    required: true
    immutable_after_execution_start: true
  exact_policy_language_merge_conflicts_and_evaluator: OPEN_ISSUE

roles:
  Analyst:
    purpose: translate natural_language_user_intent_into_unambiguous_structured_control_input
    writes_Project_State: false
    executes_project_actions: false
    expected_model: cheap_or_free_model
    OpenRouter_required: false
    one_active_dialogue_per_project_in_MVP: true
    responsibilities:
      - receive_user_messages
      - ask_sequential_clarifying_questions_when_intent_is_ambiguous
      - preserve_raw_user_input
      - produce_User_Directive_or_formalized_escalation_answer
      - infer_requested_priority_when_not_explicit
      - provide_Decision_Context_when_user_needs_more_information
      - support_profile_approval_dialogue
    context_direction:
      - recent_dialogue
      - active_project_summary
      - current_priorities
      - active_Epic_Feature_Task_or_Bug
      - recent_User_Directives
      - previous_priority_decisions
      - relevant_previous_user_decisions
    full_repository_context_by_default: false
    fine_tuning_per_session_required: false

  Orchestrator:
    purpose: own_global_project_progression_and_all_accepted_Project_State_mutation
    codes_product: false
    sole_authority_for_Project_State_changes: true
    responsibilities:
      - bootstrap_Project_State
      - derive_and_select_Epics
      - create_new_Epics_when_required
      - reprioritize_Epics
      - block_and_unblock_Epics
      - split_Epics
      - review_User_Directives
      - determine_effective_priority
      - choose_effective_execution_boundary
      - apply_accepted_User_Directives
      - launch_planning_roles
      - perform_replan_checkpoint_after_Epic_PASS
      - ensure_work_does_not_stop_prematurely
      - normalize_raw_Bugs_when_they_are_above_Feature_scope
      - route_escalations
    Core_usage:
      always_read_entire_Core: false
      read_on:
        - bootstrap
        - major_decisions
        - invariant_checks
        - escalations
    Feature_creation_authority: OPEN_ISSUE

  Epic_Planner:
    instance_scope: one_Epic
    purpose: decompose_an_immutable_Epic_into_executable_lower_level_work
    may_change_Epic_boundaries: false
    on_bad_Epic_definition: escalate_with_type_epic_revision
    codes_product: false
    expected_responsibilities_direction:
      - define_or_refine_Features_if_this_authority_is_accepted
      - decompose_Features_into_roughly_5_to_7_normal_Tasks
      - create_Task_definitions
      - create_Bug_work_contracts_for_Feature_level_Bugs
      - create_Task_work_contracts
      - assign_completion_profiles
      - add_entity_specific_acceptance_criteria
      - normalize_Feature_level_raw_Bugs
    exact_Feature_creation_authority: OPEN_ISSUE

  Implementer:
    purpose: execute_one_session_specific_Work_Contract
    may_define_project_direction: false
    may_create_next_Work_Contract: false
    modifies_product: true
    output: Session_Result
    Task_or_Bug_may_span_multiple_sessions: true

  Gatekeeper:
    replaces_names:
      - reviewer
      - verifier
      - reviewer_verifier
    purpose: independently_decide_whether_target_work_passes_an_evidence_gate
    modifies_implementation_code: false
    may_create_Bug_from_detected_defect: true
    on_failure: return_structured_Gate_Result_and_Bug_links
    separate_Bug_Gatekeeper_role: false
    levels:
      Task_Gatekeeper:
        checks:
          - local_correctness
          - code_quality
          - relevant_architecture_constraints
          - Task_acceptance_criteria
          - required_profile_checks
          - required_tests_and_runtime_evidence
        on_PASS:
          - seal_Task
          - create_Task_verified_source_control_checkpoint
      Feature_Gatekeeper:
        session_should_be_fresh_and_independent: true
        purpose: Feature_Integration_Gate
        checks:
          - Feature_aggregate_Definition_of_Done
          - integrated_behavior_of_Feature_work
          - relevant_UI_or_E2E_flows
          - regressions_inside_Feature_scope
          - inherited_completion_policy
        on_PASS:
          - seal_Feature
          - create_Feature_verified_source_control_checkpoint
      Epic_Gatekeeper:
        session_should_be_fresh_and_independent: true
        purpose: Epic_Integration_Gate
        checks:
          - Epic_aggregate_Definition_of_Done
          - business_or_technical_problem_is_actually_solved
          - rerun_key_scenarios_from_constituent_Features
          - cross_Feature_regressions
          - inherited_completion_policy
        on_PASS:
          - seal_Epic
          - create_Epic_verified_source_control_checkpoint
          - trigger_Orchestrator_replan_checkpoint

planning_hierarchy:
  canonical: Epic -> Feature -> Task
  Bug_is_parallel_first_class_work_entity: true
  Epic:
    semantic_scale: concrete_business_or_technical_problem_function_or_goal
    typical_examples:
      - Document_Editing_Core
      - PDF_Pipeline
      - Collaboration
    may_be_somewhat_smaller_when_business_problem_is_still_coherent: true
    required_definition_direction:
      - goal
      - in_scope
      - out_of_scope
      - dependencies
      - blockers
      - acceptance_criteria
      - constraints
      - inherited_completion_policy
    immutable_to_lower_level_planner_once_execution_begins: true
    orchestrator_operations:
      create: allowed_if_Core_is_not_changed
      reprioritize: allowed
      block: allowed
      unblock: allowed
      split: allowed_without_user_escalation
      merge: OPEN_ISSUE
      cancel: user_escalation_required
      delete: forbidden
    type_system:
      field_should_exist: true
      MVP_enabled_types:
        - technical
      future_candidate_types:
        - business
        - correction
  Feature:
    meaning: independently_verifiable_functional_or_technical_slice
    target_normal_Task_count: 5_to_7
    size_rule: >-
      A Feature requiring roughly 15 or more normal Tasks is presumed to be badly
      bounded and should normally be split instead of merely inflating Work Contracts.
    type_field_for_MVP: not_required
    after_Feature_Gate_PASS:
      sealed: true
      ordinary_new_Tasks: forbidden
      higher_Epic_Gate_corrective_exception: allowed_but_exact_Bug_mechanics_OPEN_ISSUE
  Task:
    meaning: bounded_unit_of_planned_implementation_work
    one_standard_schema: true
    expected_to_be_verifiable_by_one_Task_Gate: true
    separate_correction_Task_type: not_required_currently
    correction_work_direction: use_Bug_as_first_class_work_entity
  hierarchy_size_policy:
    Feature_normal_batch_target: 5_to_7_Tasks
    exact_target_Feature_count_per_Epic: OPEN_ISSUE

planning_horizon:
  full_project_detailed_Task_tree_upfront: false
  principle: rolling_horizon
  orchestrator_focus: transform_Project_Core_and_live_state_into_quality_Epics
  planner_focus: transform_current_Epic_into_quality_Features_and_Tasks
  exact_Epic_to_Feature_planning_horizon: OPEN_ISSUE
  when_to_refresh_plan_inside_open_Epic: OPEN_ISSUE

acceptance_criteria_and_DoD:
  acceptance_criteria_location: inside_target_entity
  applicable_entities:
    - Epic
    - Feature
    - Task
    - Bug
  stable_criterion_id_required: true
  immutable_after_execution_start: true
  exact_execution_start_boundary_by_entity: OPEN_ISSUE
  Definition_of_Done_model: aggregate_not_duplicate_requirement_list
  aggregate_DoD_direction:
    - all_acceptance_criteria_PASS
    - all_required_completion_policy_checks_PASS
    - required_evidence_present
    - Gatekeeper_verdict_PASS
    - no_blocking_Bug_or_mandatory_unresolved_issue
  profile_injected_universal_criteria: allowed
  planner_or_orchestrator_entity_specific_criteria: required_as_applicable

work_contracts:
  canonical_family: Work_Contract
  role: self_contained_execution_interface_for_one_agent_session
  one_new_Work_Contract_per_new_execution_session: true
  previous_chat_history_required: false
  common_base_schema: true
  known_specializations:
    Task_Work_Contract:
      target: Task
    Bug_Work_Contract:
      target: Bug
  other_role_contract_profiles:
    planning: expected_but_exact_schema_OPEN_ISSUE
    gate: expected_but_exact_schema_OPEN_ISSUE
    architecture_change: candidate
    exception: candidate
  common_required_direction:
    - id
    - project_id
    - target_entity_type
    - target_entity_id
    - session_id
    - derived_from_contract_id_if_any
    - goal
    - scope
    - non_scope
    - constraints
    - acceptance_criteria_snapshot
    - completion_policy_snapshot
    - required_inputs_and_artifact_refs
    - known_completed_work
    - forbidden_changes
    - required_evidence
    - expected_output
  immutable_after_issue: true
  worker_may_create_next_contract: false
  normal_continuation_rollover:
    planner_rerun_required: false
    new_contract_is_derived_from_previous: true
    platform_should_inherit_unchanged_fields_automatically: true
    additional_inputs:
      - semantic_handoff
      - platform_checkpoint
      - current_repository_state
      - remaining_work
      - new_constraints_if_any
  semantic_change_to_Task_or_Bug:
    planner_or_orchestrator_replanning_required: true
  exact_contract_specialization_and_validation_model: OPEN_ISSUE

context_packages:
  canonical_entity: Context_Package
  principle: strict_minimum_context_per_role_and_session
  assembled_by: platform_system_component_using_standard_rules
  planner_free_form_selection_as_only_mechanism: forbidden
  expected_sources:
    - current_Work_Contract
    - selected_Project_State_fragments
    - selected_Project_Core_constraints
    - selected_repository_files
    - selected_prior_Session_Results
    - selected_Gate_Results
    - selected_Evidence_refs
    - Environment_Manifest_subset
    - Profile_and_Completion_Policy_snapshot
  optimization_goals:
    - reduce_token_usage
    - reduce_irrelevant_information
    - improve_role_focus
    - avoid_stale_context
    - make_sessions_reproducible
  exact_selection_retrieval_budget_and_freshness_rules: OPEN_ISSUE

sessions_and_OpenCode:
  Task_or_Bug_may_span_multiple_OpenCode_sessions: true
  automatic_compaction: allowed_and_expected
  fixed_40_percent_rollover_rule: withdrawn
  handoff_must_not_depend_on_dead_session: true
  platform_checkpoint_independent_of_model: required
  OpenCode_compaction_prompt_customization: desired
  platform_checkpoint_direction:
    - work_contract_id
    - session_id
    - changed_files
    - git_diff_or_ref
    - commands_run
    - tests_run
    - artifacts
    - current_target_state
    - last_known_step
  semantic_handoff_direction:
    - decisions
    - blockers
    - important_context
    - unfinished_work
    - next_action
  forced_rollover_consistency_preference:
    rollback_to_last_confirmed_consistent_checkpoint: true
  exact_rollover_compaction_atomic_step_and_rollback_policy: OPEN_ISSUE

session_results:
  canonical_entity: Session_Result
  one_result_per_worker_session: true
  produced_on_intermediate_rollover: true
  produced_on_final_session: true
  immutable_after_creation: true
  expected_fields:
    - work_contract_id
    - session_id
    - target_entity_type
    - target_entity_id
    - outcome
    - what_was_done
    - changed_files
    - commands_run
    - tests_run
    - evidence_refs
    - artifacts_created
    - decisions
    - new_risks
    - blockers
    - unresolved_questions
    - unfinished_work
    - recommended_next_step
  Task_Result_entity_for_MVP: not_required
  Feature_Result_entity_for_MVP: not_required
  Epic_Result_entity_for_MVP: not_required

verification_and_evidence:
  completion_rule: relevant_Gatekeeper_PASS_required
  Evidence:
    canonical_entity: Evidence
    immutable_after_creation: true
    heavy_payload_storage: external_artifact_store_or_filesystem
    metadata_and_links_live_in_structured_state: true
    may_support_multiple_criterion_ids: true
    example_kinds:
      - test_report
      - command_output
      - runtime_log
      - screenshot
      - browser_trace
      - ui_recording
      - http_trace
      - build_artifact
      - diff
      - manual_observation
    creation_metadata_direction:
      - evidence_id
      - kind
      - produced_by_session
      - target_entity
      - criterion_ids
      - artifact_path_or_ref
      - checksum
      - media_type
      - captured_at
      - command_if_applicable
      - exit_code_if_applicable
      - environment_if_applicable
      - commit_sha_if_applicable
      - browser_url_if_applicable
      - test_suite_if_applicable
      - duration_if_applicable
    post_creation_Gatekeeper_annotations_modify_Evidence: false
  Gate_Result:
    canonical_entity: Gate_Result
    one_general_schema_for_all_gate_levels: true
    target_type_values_direction:
      - task
      - bug
      - feature
      - epic
    must_store_more_than_pass_fail: true
    required_direction:
      - gate_result_id
      - target_type
      - target_id
      - gate_level
      - scope_checked
      - checks_run
      - criterion_verdicts
      - evidence_refs
      - Bug_refs_or_detected_defects
      - final_verdict
      - Gatekeeper_summary
    criterion_traceability:
      required: true
      chain: criterion_id -> check -> Evidence_ref -> verdict
  backend_evidence_examples:
    - unit_tests
    - integration_tests
    - actual_test_output
    - runtime_logs
  UI_evidence_examples:
    - real_application_start
    - automated_UI_clickthrough
    - screenshots
    - browser_or_UI_trace
    - console_errors
    - assertions_on_visible_behavior
  integration_evidence_examples:
    - end_to_end_scenario
    - cross_component_runtime_test
  exact_evidence_retention_size_and_integrity_policy: OPEN_ISSUE

bugs:
  canonical_entity: Bug
  first_class_work_entity_alongside:
    - Epic
    - Feature
    - Task
  Bug_is_not_a_Fix_Task_wrapper: true
  Bug_can_be_executed_directly_via_Bug_Work_Contract: true
  Bug_may_span_multiple_worker_sessions: true
  if_Bug_is_too_large: decompose_into_child_Bugs
  creation_sources:
    - Gatekeeper
    - manual_user_report
    - future_external_or_release_checks
  lifecycle_minimum:
    - open
    - resolved
  raw_manual_Bug:
    weak_structure_allowed: true
    may_be_compound: true
    expected_actual_and_reproduction_steps_may_be_missing_initially: true
    normalized_before_execution: true
  Gatekeeper_created_Bug:
    reproduction_steps_required: true
    evidence_of_defect_required: true
  fields_direction:
    - bug_id
    - title_or_summary
    - description
    - expected_behavior
    - actual_behavior
    - reproduction_steps
    - severity
    - priority
    - parent_bug_id_if_any
    - target_relationships
    - acceptance_criteria
    - evidence_refs
    - status
  severity:
    scale:
      - low
      - medium
      - high
      - critical
    independent_from_priority: true
    set_by_detecting_or_normalization_source: true
    Orchestrator_rewrites_severity: false
  priority:
    scale: 0_to_10
    independent_from_severity: true
    critical_does_not_automatically_mean_priority_10: true
  normalization_authority_direction:
    raw_Bug_above_Feature_scope: Orchestrator
    Bug_inside_specific_Feature: Epic_Planner
  open_Epic_behavior:
    Feature_specific_defect: keep_Bug_under_affected_Feature
    cross_Feature_problem: >-
      Keep an aggregate parent Bug and decompose it into Feature-level child Bugs
      rather than pretending one leaf Bug belongs to several Features.
  sealed_Epic_behavior:
    mutate_sealed_Epic: false
    create_new_Epic_for_corrective_work: true
    correction_Epic_type_is_future_candidate_but_not_yet_enabled_in_MVP_type_enum: true
  aggregate_parent_Bug:
    stays_open_until_all_children_resolved: true
    children_resolved_is_not_sufficient_for_parent_closure: true
    final_parent_Gatekeeper_confirmation_required: true
    Bug_Result_created_on_parent_closure: true
  leaf_Bug:
    separate_Bug_Result_required: false
    closure_direction: Bug_Gate_PASS
  separate_Bug_Gatekeeper_role: false
  Gatekeeper_selection_direction:
    Feature_level_Bug: Feature_Gatekeeper
    aggregate_cross_Feature_Bug: Epic_Gatekeeper
    Bug_in_future_correction_Epic: Gatekeeper_of_that_new_Epic_hierarchy
  Bug_DoD_direction:
    separate_duplicate_DoD_list: false
    use_expected_behavior_acceptance_criteria_completion_policy_and_Gate_PASS: true
  exact_Bug_hierarchy_and_sealed_Feature_exception_rules: OPEN_ISSUE

bug_results:
