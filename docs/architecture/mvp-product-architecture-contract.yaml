    superseded: meaning_replaced_by_newer_directive
    cancelled: intentionally_not_executed
  project_or_platform_paused_is_not_a_directive_status: true
  accepted_directive_may_later_be_cancelled_or_superseded: true

priority_model:
  scale: 0_to_10
  mapping:
    0: parked
    1_to_2: low
    3_to_4: below_normal
    5: normal_baseline
    6_to_7: high
    8: urgent
    9: must_run_next_after_current_executing_work
    10: interrupt_now
  requested_priority_authority: Analyst_or_explicit_user_input
  effective_priority_authority: Orchestrator
  Orchestrator_adjustment:
