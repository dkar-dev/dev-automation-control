    - create_or_link_Feature_level_Bugs
    - issue_Bug_Work_Contracts
    - resolve_Bugs
    - rerun_Feature_Gate
  Epic_Gate_FAIL:
    - Epic_remains_unsealed
    - identify_affected_Features_or_cross_Feature_problem
    - create_or_link_Bugs
    - permit_explicit_higher_level_corrective_work_against_affected_sealed_Features
    - rerun_required_lower_gates
    - rerun_Epic_Gate
